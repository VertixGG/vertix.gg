<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-B87MBQLL99"></script>
	<script>
		window.dataLayer = window.dataLayer || [];

		function gtag() {
			dataLayer.push( arguments );
		}

		gtag( 'js', new Date() );

		gtag( 'config', 'G-B87MBQLL99' ); // Analytics.
		gtag( 'config', 'AW-993508183' ); // Ads.
	</script>

	<meta charset="utf-8"/>
	<link rel="icon" href="/vc-naked.ico"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>

	<!-- Brand + body faces. These live here rather than as an `@import` in the CSS
	     bundle so the preload scanner finds them while the HTML is still parsing.
	     An `@import` is only discovered after the bundle has downloaded and begun
	     parsing, which serialises two cross-origin round trips ahead of first
	     paint and was costing the hero heading seconds of render delay. -->
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link
		rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&amp;family=Red+Hat+Display:wght@300;400;500;700&amp;display=swap"
	/>

	<!-- Baseline tags. `seo/use-document-meta.ts` rewrites these per route once
	     the app boots, but crawlers and link unfurlers that don't run JavaScript
	     (Discord's included) only ever see what is written here. -->
	<meta
		name="description"
		content="VoiceChannels creates temporary voice channels on demand for your Discord server, with per-channel owner controls, auto-scaling and a web dashboard."
	/>
	<link rel="canonical" href="https://voicechannels.online/"/>

	<meta property="og:type" content="website"/>
	<meta property="og:site_name" content="VoiceChannels"/>
	<meta property="og:title" content="Discord Temporary Voice Channels — Join to Create Bot | VoiceChannels"/>
	<meta property="og:description" content="VoiceChannels creates temporary voice channels on demand for your Discord server, with per-channel owner controls, auto-scaling and a web dashboard."/>
	<meta property="og:url" content="https://voicechannels.online/"/>
	<meta property="og:image" content="https://voicechannels.online/og-card.png"/>
	<meta property="og:image:width" content="1200"/>
	<meta property="og:image:height" content="630"/>
	<meta property="og:image:alt" content="VoiceChannels - temporary Discord voice channels, on demand"/>
	<meta name="twitter:card" content="summary_large_image"/>
	<meta name="twitter:image" content="https://voicechannels.online/og-card.png"/>

	<!-- Apple wants 180x180 here. The square brand art is 500x500, and pointing at it meant
	     every page pulled 75KiB of icon it could only ever draw a fifth of. -->
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
	<link rel="manifest" href="/manifest.json"/>
	<title>Discord Temporary Voice Channels — Join to Create Bot | VoiceChannels</title>

	<script>
		if ( window.parent !== window.self ) {
			try {
				if ( window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__ ) {
					window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
				}
			} catch ( e ) {
			}
		}
	</script>
</head>

<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
