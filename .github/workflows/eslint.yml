permissions:
  # All other permissions are set to none
  checks: write
  contents: read
  pull-requests: write

name: Lint

on: [ push, pull_request ]

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  file-diff:
    runs-on: ubuntu-22.04
    name: Lint - File Diff
    outputs:
      js_diff: ${{ steps.js_diff_files.outputs.diff }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Check JS files diff
        id: js_diff_files
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            **/*.+(js|ts|json|jsx|tsx)
            package*.json
            .github/**/*.yml

  ESLint:
    runs-on: ubuntu-22.04
    needs: [ 'file-diff' ]
    if: ${{ needs.file-diff.outputs.js_diff }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Cache dependencies
        uses: buildjet/cache@v4
        id: deps-cache
        continue-on-error: true
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package.json', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache ESLint
        uses: buildjet/cache@v4
        id: eslint-cache
        continue-on-error: true
        with:
          path: |
            .eslintcache
            packages/*/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/.eslintrc.json', '**/eslint.config.js', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Install dependencies
        run: bun install

      - name: Run eslint
        run: bun run vertix:ci:eslint
