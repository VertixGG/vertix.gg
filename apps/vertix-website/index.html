<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<!-- Google tag (gtag.js).

	     The queue is built here and the calls are made here, so nothing said before
	     the library arrives is lost: gtag() only pushes onto dataLayer, and the
	     library drains whatever is waiting the moment it loads.

	     The library itself is the heaviest thing the page asks for - 537KiB across
	     its three requests and a quarter second of main thread - and none of it is
	     needed to draw the page. It is fetched once the page has settled instead of
	     racing the content for bandwidth: on the reader's first interaction, or
	     shortly after load for a reader who only reads.

	     The cost is that somebody who leaves inside that window is not counted.
	     That is why the window closes on the first touch rather than on a timer
	     alone, and why it is short. -->
	<script>
		window.dataLayer = window.dataLayer || [];

		function gtag() {
			dataLayer.push( arguments );
		}

		gtag( 'js', new Date() );

		gtag( 'config', 'G-B87MBQLL99' ); // Analytics.
		gtag( 'config', 'AW-993508183' ); // Ads.

		( function () {
			var requested = false;

			function request() {
				if ( requested ) {
					return;
				}

				requested = true;

				var tag = document.createElement( 'script' );

				tag.async = true;
				tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-B87MBQLL99';

				// Prerendering serialises whatever the dom holds when it is done, and this
				// tag would be baked into the shipped html as an ordinary head script -
				// loading eagerly for every reader, which is the one thing it is here to
				// avoid. The build strips anything carrying this attribute on its way out.
				tag.setAttribute( 'data-vc-runtime', '' );

				document.head.appendChild( tag );
			}

			[ 'pointerdown', 'keydown', 'touchstart', 'scroll' ].forEach( function ( event ) {
				window.addEventListener( event, request, { once: true, passive: true } );
			} );

			window.addEventListener( 'load', function () {
				if ( window.requestIdleCallback ) {
					window.requestIdleCallback( request, { timeout: 1500 } );
				} else {
					setTimeout( request, 1500 );
				}
			} );
		} )();
	</script>

	<meta charset="utf-8"/>
	<link rel="icon" href="/vc-naked.ico"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>

	<!-- Brand + body faces. These live here rather than as an `@import` in the CSS
	     bundle so the preload scanner finds them while the HTML is still parsing.
	     An `@import` is only discovered after the bundle has downloaded and begun
	     parsing, which serialises two cross-origin round trips ahead of first
	     paint and was costing the hero heading seconds of render delay.

	     The sheet is fetched at stylesheet priority by the preload and applied on
	     load rather than before first paint: `print` matches no screen, so it does
	     not hold render, and the onload hands it back to every medium. The faces
	     already carry `display=swap`, so the heading was always going to paint in
	     the fallback and swap when they arrived - waiting on the sheet bought the
	     reader nothing and cost 780ms of blocked render. Without javascript the
	     noscript copy applies it the ordinary blocking way. -->
	<link rel="preconnect" href="https://fonts.googleapis.com"/>
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
	<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&amp;family=Red+Hat+Display:wght@300;400;500;700&amp;display=swap"/>
	<link
		rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&amp;family=Red+Hat+Display:wght@300;400;500;700&amp;display=swap"
		media="print"
		onload="this.media=&#39;all&#39;"
	/>
	<noscript>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&amp;family=Red+Hat+Display:wght@300;400;500;700&amp;display=swap"/>
	</noscript>

	<!-- Baseline tags. `seo/use-document-meta.ts` rewrites these per route once
	     the app boots, but crawlers and link unfurlers that don't run JavaScript
	     (Discord's included) only ever see what is written here. -->
	<meta
		name="description"
		content="VoiceChannels creates temporary voice channels on demand for your Discord server, with per-channel owner controls, auto-scaling and a web dashboard."
	/>
	<link rel="canonical" href="https://voicechannels.online/"/>

	<meta property="og:type" content="website"/>
	<meta property="og:site_name" content="VoiceChannels"/>
	<meta property="og:title" content="Discord Temporary Voice Channels — Join to Create Bot | VoiceChannels"/>
	<meta property="og:description" content="VoiceChannels creates temporary voice channels on demand for your Discord server, with per-channel owner controls, auto-scaling and a web dashboard."/>
	<meta property="og:url" content="https://voicechannels.online/"/>
	<meta property="og:image" content="https://voicechannels.online/og-card.png"/>
	<meta property="og:image:width" content="1200"/>
	<meta property="og:image:height" content="630"/>
	<meta property="og:image:alt" content="VoiceChannels - temporary Discord voice channels, on demand"/>
	<meta name="twitter:card" content="summary_large_image"/>
	<meta name="twitter:image" content="https://voicechannels.online/og-card.png"/>

	<!-- Apple wants 180x180 here. The square brand art is 500x500, and pointing at it meant
	     every page pulled 75KiB of icon it could only ever draw a fifth of. -->
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
	<link rel="manifest" href="/manifest.json"/>
	<title>Discord Temporary Voice Channels — Join to Create Bot | VoiceChannels</title>

	<script>
		if ( window.parent !== window.self ) {
			try {
				if ( window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__ ) {
					window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = window.parent.__REACT_DEVTOOLS_GLOBAL_HOOK__;
				}
			} catch ( e ) {
			}
		}
	</script>
</head>

<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
